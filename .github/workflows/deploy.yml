name: Deploy

# Pushing to `main` deploys this app THROUGH THE APPGARDEN DEPLOY GATEWAY.
# The lint/typecheck/build steps gate the deploy: if any fails, nothing ships.
#
# ZERO repository secrets: the only deploy credential is a short-lived GitHub
# OIDC id-token this workflow mints per run. The gateway verifies it (repo
# registration + ref == main) and holds every Cloudflare credential
# server-side — there is no Cloudflare token in this org to leak or rotate.
# The gateway also creates this app's R2 bucket and stamps all bindings, so
# the deploy is exactly: build → mint token → POST the bundle.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Mint the OIDC id-token the gateway authenticates — the repo's zero-secret
  # deploy credential.
  id-token: write

jobs:
  deploy:
    # The template repo itself is not a registered App (the gateway would deny
    # it), so its own pushes skip the deploy. Repos created from it are
    # registered at creation and deploy normally.
    if: github.repository != 'appgarden-io/internal-app-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Minted straight from the runner's token endpoint (no third-party
      # action), masked, and handed to the deploy script as env.
      - name: Mint the deploy OIDC token
        run: |
          token="$(curl -sSf \
            --connect-timeout 5 --max-time 15 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://deploy.appgarden.io" \
            | jq -r '.value')"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "Failed to mint the OIDC id-token." >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "DEPLOY_OIDC_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Deploy through the AppGarden gateway
        run: node scripts/deploy-bundle.mjs
      - name: Summarise the live URL
        run: |
          echo "### Live: https://${{ github.event.repository.name }}.${{ vars.APPGARDEN_APPS_DOMAIN }}" >> "$GITHUB_STEP_SUMMARY"
