name: Deploy

# Pushing to `main` deploys this app. The lint/typecheck/build steps gate the
# deploy: if any fails, `wrangler deploy` never runs. This is the ONLY blessed
# way to deploy — never run `wrangler deploy` by hand (it would land the Worker
# outside the dispatch namespace and bypass Cloudflare Access).
on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # The template repo itself has no Cloudflare credentials/namespace, so its own
    # pushes would always fail the deploy step. Skip on the template; repos created
    # from it (where the Operator sets the org's Actions secrets/vars) deploy normally.
    if: github.repository != 'appgarden-io/internal-app-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Point the R2 binding at THIS app's own bucket (named after the repo = the
      # Slug) BEFORE the build bakes wrangler.jsonc into dist/. wrangler has no
      # bucket_name override flag, so we rewrite the local-dev placeholder here —
      # mirroring how --name / --var APP_SLUG inject the repo identity at deploy.
      - name: Point R2 binding at this app's bucket
        run: sed -i "s|appgarden-app-bucket|${{ github.event.repository.name }}|" wrangler.jsonc
      - run: npm run build
      # Create this app's R2 bucket before deploy. Idempotent: created on the
      # first deploy, reused after. Uses the same Cloudflare token as the deploy
      # (MVP), which must carry `Workers R2 Storage Write`. `bucket create` errors
      # if the bucket already exists; tolerate ONLY that and fail loud otherwise.
      - name: Create this app's R2 bucket
        run: |
          bucket="${{ github.event.repository.name }}"
          if npx wrangler r2 bucket create "$bucket" 2> r2-err.log; then
            echo "Created R2 bucket $bucket"
          elif grep -qiE "already (exists|owned)" r2-err.log; then
            echo "R2 bucket $bucket already exists — continuing"
          else
            cat r2-err.log >&2
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to the dispatch namespace
        # --name is the repo name (the app Slug); the dispatch namespace and the
        # Cloudflare credentials come from the Client GitHub org's Actions
        # secrets/vars, set once by the Operator at provisioning. --var APP_SLUG
        # (also the repo name) drives the app's display name.
        run: npx wrangler deploy --name "${{ github.event.repository.name }}" --dispatch-namespace "${{ vars.APPGARDEN_NAMESPACE }}" --var "APP_SLUG:${{ github.event.repository.name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Summarise the live URL
        run: |
          echo "### Live: https://${{ github.event.repository.name }}.${{ vars.APPGARDEN_APPS_DOMAIN }}" >> "$GITHUB_STEP_SUMMARY"
